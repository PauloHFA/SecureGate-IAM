name: securegate-iam

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Execute Initialize-Local.ps1}
      POSTGRES_USER: ${POSTGRES_USER:?Execute Initialize-Local.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute Initialize-Local.ps1}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute Initialize-Local.ps1}
    command:
      - /bin/sh
      - -ec
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./.local/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: [CMD-SHELL, 'rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running']
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.21.4
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Execute Initialize-Local.ps1}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: [server, -dev]
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: [CMD, vault, status]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault:1.21.4
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?Execute Initialize-Local.ps1}
      POSTGRES_DB: ${POSTGRES_DB:?Execute Initialize-Local.ps1}
      POSTGRES_USER: ${POSTGRES_USER:?Execute Initialize-Local.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute Initialize-Local.ps1}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute Initialize-Local.ps1}
      RABBITMQ_USER: ${RABBITMQ_USER:?Execute Initialize-Local.ps1}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Execute Initialize-Local.ps1}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:?Execute Initialize-Local.ps1}
    volumes:
      - ./vault:/bootstrap:ro
      - ./.local:/output
    entrypoint: [/bin/sh, /bootstrap/init.sh]
    restart: "no"

  iam-core:
    profiles: [full]
    build:
      context: ..
      dockerfile: iam-core/Dockerfile
    image: securegate/iam-core:0.1.0-snapshot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      IAM_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Execute Initialize-Local.ps1}
      IAM_DATABASE_USERNAME: ${POSTGRES_USER:?Execute Initialize-Local.ps1}
      IAM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Execute Initialize-Local.ps1}
      IAM_AUTHORIZATION_ENABLED: "true"
      IAM_BOOTSTRAP_ENABLED: "true"
      IAM_BOOTSTRAP_TOKEN: ${IAM_BOOTSTRAP_TOKEN:-bootstrap-dev-token-minimum-32-chars-long!}
      IAM_TRANSIT_ENABLED: "true"
      IAM_VAULT_ADDRESS: http://vault:8200
      IAM_VAULT_ROLE_ID_FILE: /etc/securegate/iam-core-role-id
      IAM_VAULT_SECRET_ID_FILE: /etc/securegate/iam-core-secret-id
      IAM_RABBITMQ_HOST: rabbitmq
      IAM_RABBITMQ_PORT: 5672
      IAM_RABBITMQ_VHOST: ${RABBITMQ_VHOST:-securegate}
      IAM_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Execute Initialize-Local.ps1}
      IAM_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Execute Initialize-Local.ps1}
      IAM_RESOURCE_ENFORCEMENT_ENABLED: "true"
      IAM_ENFORCEMENT_REDIS_HOST: redis
      IAM_ENFORCEMENT_REDIS_PORT: 6379
      IAM_ENFORCEMENT_REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute Initialize-Local.ps1}
      IAM_BIND_ADDRESS: 0.0.0.0
      IAM_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.local/iam-core-role-id:/etc/securegate/iam-core-role-id:ro
      - ./.local/iam-core-secret-id:/etc/securegate/iam-core-secret-id:ro
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q "\"status\":\"UP\""']
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  policy-enforcer:
    profiles: [full]
    build:
      context: ..
      dockerfile: policy-enforcer/Dockerfile
    image: securegate/policy-enforcer:0.1.0-snapshot
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      iam-core:
        condition: service_healthy
    environment:
      ENFORCER_REDIS_HOST: redis
      ENFORCER_REDIS_PORT: 6379
      ENFORCER_REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute Initialize-Local.ps1}
      ENFORCER_CONSUMER_ENABLED: "true"
      ENFORCER_RABBITMQ_HOST: rabbitmq
      ENFORCER_RABBITMQ_PORT: 5672
      ENFORCER_RABBITMQ_VHOST: ${RABBITMQ_VHOST:-securegate}
      ENFORCER_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Execute Initialize-Local.ps1}
      ENFORCER_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Execute Initialize-Local.ps1}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
