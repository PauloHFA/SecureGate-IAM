name: securegate-iam

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Execute Initialize-Local.ps1}
      POSTGRES_USER: ${POSTGRES_USER:?Execute Initialize-Local.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute Initialize-Local.ps1}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute Initialize-Local.ps1}
    command:
      - /bin/sh
      - -ec
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./.local/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: [CMD-SHELL, 'rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running']
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.21.4
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Execute Initialize-Local.ps1}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: [server, -dev]
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: [CMD, vault, status]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault:1.21.4
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?Execute Initialize-Local.ps1}
      POSTGRES_DB: ${POSTGRES_DB:?Execute Initialize-Local.ps1}
      POSTGRES_USER: ${POSTGRES_USER:?Execute Initialize-Local.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute Initialize-Local.ps1}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute Initialize-Local.ps1}
      RABBITMQ_USER: ${RABBITMQ_USER:?Execute Initialize-Local.ps1}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Execute Initialize-Local.ps1}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:?Execute Initialize-Local.ps1}
    volumes:
      - ./vault:/bootstrap:ro
      - ./.local:/output
    entrypoint: [/bin/sh, /bootstrap/init.sh]
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
