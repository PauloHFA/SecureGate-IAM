global:
  scrape_interval: 5s
  scrape_timeout: 3s
scrape_configs:
  - job_name: iam-core
    metrics_path: /actuator/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/iam-metrics-token
    static_configs:
      - targets: ['host.docker.internal:__IAM_PORT__']
