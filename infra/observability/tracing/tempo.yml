# Local, single-binary evaluation backend; application export is enabled separately.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
  log_received_spans:
    enabled: false
  log_discarded_spans:
    enabled: false

query_frontend:
  mcp_server:
    enabled: false

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_scheduler:
  provider:
    retention:
      interval: 5m
    compaction:
      compaction:
        block_retention: 24h
backend_worker:
  compaction:
    block_retention: 24h

live_store:
  wal:
    path: /var/tempo/live-store/traces
  shutdown_marker_dir: /var/tempo/live-store/shutdown-marker
  max_live_traces_bytes: 33554432

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 1048576
      burst_size_bytes: 2097152
      max_traces_per_user: 1000
    global:
      max_bytes_per_trace: 1048576
    metrics_generator:
      processors: []

usage_report:
  reporting_enabled: false
