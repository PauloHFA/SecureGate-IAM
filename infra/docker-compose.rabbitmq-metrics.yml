# Optional overlay; use together with infra/docker-compose.yml.
services:
  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_METRICS_PORT:-15692}:15692"
    volumes:
      - ./rabbitmq/rabbitmq.metrics.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins.metrics:/etc/rabbitmq/enabled_plugins:ro
