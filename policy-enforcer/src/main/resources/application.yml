spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.logging.OpenTelemetryLoggingAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.opentelemetry.OpenTelemetryAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.OpenTelemetryTracingAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.MicrometerTracingAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.NoopTracerAutoConfiguration
  application:
    name: policy-enforcer
  main:
    web-application-type: none
  data:
    redis:
      host: ${ENFORCER_REDIS_HOST:127.0.0.1}
      port: ${ENFORCER_REDIS_PORT:6379}
      password: ${ENFORCER_REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
management:
  tracing:
    enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
enforcer:
  metrics:
    enabled: ${ENFORCER_METRICS_ENABLED:false}
    port: ${ENFORCER_METRICS_PORT:19091}
    token-file: ${ENFORCER_METRICS_TOKEN_FILE:}
  consumer:
    enabled: ${ENFORCER_CONSUMER_ENABLED:false}
    host: ${ENFORCER_RABBITMQ_HOST:127.0.0.1}
    port: ${ENFORCER_RABBITMQ_PORT:5672}
    virtual-host: ${ENFORCER_RABBITMQ_VHOST:securegate}
    username: ${ENFORCER_RABBITMQ_USERNAME:}
    password: ${ENFORCER_RABBITMQ_PASSWORD:}

# Local OTLP export is a separate opt-in from tracing instrumentation.
securegate:
  tracing:
    export:
      enabled: false
      endpoint: http://127.0.0.1:14318/v1/traces
