spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.server.servlet.OAuth2AuthorizationServerAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.server.servlet.OAuth2AuthorizationServerJwtAutoConfiguration
  application:
    name: iam-core
  datasource:
    url: ${IAM_DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/securegate}
    username: ${IAM_DATABASE_USERNAME:securegate}
    password: ${IAM_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  mvc:
    problemdetails:
      enabled: true

iam:
  pam:
    enabled: ${IAM_PAM_ENABLED:false}
  database:
    vault:
      enabled: ${IAM_DATABASE_VAULT_ENABLED:false}
  audit:
    query:
      enabled: ${IAM_AUDIT_QUERY_ENABLED:false}
    consumer:
      enabled: ${IAM_AUDIT_CONSUMER_ENABLED:false}
      host: ${IAM_RABBITMQ_HOST:127.0.0.1}
      port: ${IAM_RABBITMQ_PORT:5672}
      virtual-host: ${IAM_RABBITMQ_VHOST:securegate}
      username: ${IAM_RABBITMQ_USERNAME:}
      password: ${IAM_RABBITMQ_PASSWORD:}
      batch-size: ${IAM_AUDIT_CONSUMER_BATCH_SIZE:20}
      poll-millis: ${IAM_AUDIT_CONSUMER_POLL_MILLIS:1000}
    partitions:
      enabled: ${IAM_AUDIT_PARTITIONS_ENABLED:false}
      database-url: ${IAM_AUDIT_DATABASE_URL:}
      username: ${IAM_AUDIT_MAINTENANCE_USERNAME:}
      password-file: ${IAM_AUDIT_MAINTENANCE_PASSWORD_FILE:}
    ingestion:
      enabled: ${IAM_AUDIT_INGESTION_ENABLED:false}
      database-url: ${IAM_AUDIT_DATABASE_URL:}
      username: ${IAM_AUDIT_INGEST_USERNAME:}
      password-file: ${IAM_AUDIT_INGEST_PASSWORD_FILE:}
  resources:
    enforcement:
      enabled: ${IAM_RESOURCE_ENFORCEMENT_ENABLED:false}
      host: ${IAM_ENFORCEMENT_REDIS_HOST:127.0.0.1}
      port: ${IAM_ENFORCEMENT_REDIS_PORT:6379}
      password: ${IAM_ENFORCEMENT_REDIS_PASSWORD:}
  outbox:
    operations:
      retention-enabled: ${IAM_OUTBOX_RETENTION_ENABLED:false}
      retention-days: ${IAM_OUTBOX_RETENTION_DAYS:7}
      batch-size: ${IAM_OUTBOX_RETENTION_BATCH_SIZE:100}
      poll-millis: ${IAM_OUTBOX_OPERATIONS_POLL_MILLIS:30000}
    publisher:
      enabled: ${IAM_OUTBOX_PUBLISHER_ENABLED:false}
      host: ${IAM_RABBITMQ_HOST:127.0.0.1}
      port: ${IAM_RABBITMQ_PORT:5672}
      virtual-host: ${IAM_RABBITMQ_VHOST:securegate}
      username: ${IAM_RABBITMQ_USERNAME:}
      password: ${IAM_RABBITMQ_PASSWORD:}
  authorization:
    enabled: ${IAM_AUTHORIZATION_ENABLED:false}
    issuer: ${IAM_ISSUER:http://127.0.0.1:8080}
  transit:
    enabled: ${IAM_TRANSIT_ENABLED:false}
    address: ${IAM_VAULT_ADDRESS:http://127.0.0.1:8200}
    role-id-file: ${IAM_VAULT_ROLE_ID_FILE:infra/.local/iam-core-role-id}
    secret-id-file: ${IAM_VAULT_SECRET_ID_FILE:infra/.local/iam-core-secret-id}
    key-name: securegate-jwt
    timeout: 2s
    public-key-cache-ttl: 30s
    max-concurrent-requests: 8
  bootstrap:
    enabled: ${IAM_BOOTSTRAP_ENABLED:false}
    token: ${IAM_BOOTSTRAP_TOKEN:}

server:
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 15m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
  address: ${IAM_BIND_ADDRESS:127.0.0.1}
  port: ${IAM_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    org.springframework.boot: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
    com.zaxxer.hikari: INFO
  pattern:
    level: '%5p [correlationId=%X{correlationId:-}]'
